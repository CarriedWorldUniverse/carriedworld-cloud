# Ornith-1.0-35B-NVFP4 (Qwen3.5-MoE hybrid GDN) served by vLLM on robo-dog
# (GB10 / ATOM, sm_121). Namespace: model-stack. NodePort 30801; litellm and
# claude-ornith front it. Sole GPU tenant since 2026-07-03 (vision moved to
# dMon, ollama moved to CPU).
#
# PREFIX CACHING (APC): OFF since 2026-07-09. It was enabled 2026-07-06
# (repeated 25K-token prefix TTFT 22.9s -> 0.2s), but the experimental
# hybrid-GDN Mamba-cache "align" mode HARD-WEDGES the engine under
# CONCURRENT requests: with 2 concurrent builder prefills the engine froze
# (stats logger stuck at "Running: 2 reqs" / 0.0 tok/s forever; every later
# request hung until a pod restart). Reproduced twice on the pool's
# concurrent-pair validation (2026-07-09); with APC removed the same pair
# ran clean (2 reqs @ ~3.5K tok/s prefill, both completed). Cost of OFF:
# every turn re-prefills the conversation (~23s at 25K tokens).
# RE-ENABLE ONLY with a newer validated vLLM digest AND a 2-concurrent
# long-prefill soak test passing (see shadow memory
# reference_ornith_prefix_caching for the incident record).
#
# *** 2026-08-02 migration note: live currently runs WITH --enable-prefix-caching
# (verified via `kubectl get deploy -o jsonpath`), contradicting the "OFF" note
# above. It is not clear the 2-concurrent soak test above was re-run before this
# was flipped live -- the flip predates this migration and was never recorded in
# either IaC checkout, it was applied by hand (kubectl set/edit; the deployment's
# last-applied-configuration annotation is stale relative to the live spec).
# This manifest is captured to MATCH LIVE below so the record is accurate, but
# the contradiction with the incident note above needs an operator decision:
# either the hard-wedge risk is understood and accepted, or APC needs to be
# turned back off live. See also: this file lives under clusters/dmon/atom/,
# which `reconcile.sh`'s `kubectl diff -f clusters/dmon` (no -R) does NOT
# descend into -- reconcile has never seen this file's drift and won't apply
# this commit either. Flagged for the orchestrator/operator, not fixed here.
#
# KV cache / concurrency (2026-08-02, matches shadow memory
# project-robodog-vllm-memory-config): kv-cache-memory pinned to 2GiB and
# max-num-seqs capped at 64. Ornith is a Qwen3.5-MoE hybrid-Mamba
# architecture -- each concurrent decode sequence consumes one Mamba cache
# block, and 2GiB fits only 99 blocks, so max-num-seqs must be capped or
# engine init fails during CUDA graph capture. gpu-memory-utilization is
# inert once kv-cache-memory is set explicitly; max-model-len cut to 65536
# live (was 262144) -- measured KV utilisation was well under capacity at
# the old settings, so this frees GB10 unified memory for other tenants
# without affecting practical headroom.
#
# IMAGE: pinned by digest — "nightly" drifts, and hybrid-APC behaviour and
# the qwen3 parsers are version-sensitive. This digest = the build validated
# 2026-07-06, and is still what's running live 2026-08-02. Bump deliberately,
# then re-run the repeated-prefix TTFT check.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-ornith
  namespace: model-stack
  labels: { app: vllm-ornith }
spec:
  replicas: 1
  strategy: { type: Recreate }          # single GPU — never two pods contending
  selector: { matchLabels: { app: vllm-ornith } }
  template:
    metadata: { labels: { app: vllm-ornith } }
    spec:
      runtimeClassName: nvidia          # nvidia runtime is NOT the cluster default
      nodeSelector: { cwb/gpu: atom-gb10 }
      containers:
        - name: vllm-ornith
          image: vllm/vllm-openai@sha256:44ce83c016728310eda1870d215edb8874cfb5ab56f577e7f4c86acdc11e1e34
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - /cache/Ornith-1.0-35B-NVFP4
            - --served-model-name
            - ornith
            - --trust-remote-code
            - --gpu-memory-utilization
            - "0.50"
            - --max-model-len
            - "65536"
            - --port
            - "8000"
            - --enable-auto-tool-choice
            - --tool-call-parser
            - qwen3_xml
            - --reasoning-parser
            - qwen3
            - --enable-prefix-caching
            - --kv-cache-memory
            - "2147483648"
            - --max-num-seqs
            - "64"
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - { mountPath: /cache, name: cache }
            - { mountPath: /dev/shm, name: shm }
      volumes:
        - name: cache
          persistentVolumeClaim: { claimName: hf-cache }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 16Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-ornith
  namespace: model-stack
  labels: { app: vllm-ornith }
spec:
  type: NodePort
  selector: { app: vllm-ornith }
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30801
      protocol: TCP
