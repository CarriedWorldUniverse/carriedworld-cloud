# Ornith-1.0-35B-NVFP4 (Qwen3.5-MoE hybrid GDN) served by vLLM on robo-dog
# (GB10 / ATOM, sm_121). Namespace: model-stack. NodePort 30801; litellm and
# claude-ornith front it. Sole GPU tenant since 2026-07-03 (gpu-mem-util 0.85,
# vision moved to dMon).
#
# PREFIX CACHING (APC): ON again since 2026-07-26, after the re-enable
# precondition below was finally met.
#
# History: enabled 2026-07-06 (repeated 25K-token prefix TTFT 22.9s -> 0.2s),
# then REMOVED 2026-07-09 because the experimental hybrid-GDN Mamba-cache
# "align" mode hard-wedged the engine under CONCURRENT requests: with 2
# concurrent builder prefills the engine froze (stats logger stuck at
# "Running: 2 reqs" / 0.0 tok/s forever; every later request hung until a pod
# restart), reproduced twice. Cost of OFF was a full re-prefill every turn
# (~23s at 25K tokens). The stated bar for re-enabling was a validated digest
# plus a 2-concurrent long-prefill soak.
#
# EVIDENCE FOR RE-ENABLING (2026-07-26), on THIS SAME digest — i.e. the very
# build that wedged in July, so the change is the flag, not the image:
#   - Single-shot: 25K prefix conc 1/2/4 and 120K prefix conc 2 — all clean.
#     Repeated-prefix TTFT 3.6s -> 0.2s (25K) and 35.7s -> 0.4s (120K).
#   - 8-HOUR AGENT-SHAPED SOAK: 253 cycles, 4 rotating load profiles (2-4
#     concurrent agents, 5-14 turns each, contexts growing to 200K, staggered
#     arrivals, tool definitions every request). ZERO wedges, zero failed
#     cycles, no pod restarts, cache hit rate 50-83%, engine responsive after.
#   - Needle-retrieval correctness 100% on cache hits — align mode is not
#     serving stale or wrong content.
#
# HONEST LIMIT: this is one 8h synthetic soak; the July incident emerged from
# real builder traffic over days. This is the strongest evidence available,
# not proof of absence. If long multi-turn sessions ever go weird on Ornith,
# suspect this flag FIRST — revert is dropping the one arg below.
# Full record: shadow memory reference_ornith_prefix_caching.
#
# IMAGE: pinned by digest — "nightly" drifts, and hybrid-APC behaviour and
# the qwen3 parsers are version-sensitive. This digest = the build validated
# 2026-07-06. Bump deliberately, then re-run the repeated-prefix TTFT check.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-ornith
  namespace: model-stack
  labels: { app: vllm-ornith }
spec:
  replicas: 1
  strategy: { type: Recreate }          # single GPU — never two pods contending
  selector: { matchLabels: { app: vllm-ornith } }
  template:
    metadata: { labels: { app: vllm-ornith } }
    spec:
      runtimeClassName: nvidia          # nvidia runtime is NOT the cluster default
      nodeSelector: { cwb/gpu: atom-gb10 }
      containers:
        - name: vllm-ornith
          image: vllm/vllm-openai@sha256:44ce83c016728310eda1870d215edb8874cfb5ab56f577e7f4c86acdc11e1e34
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - /cache/Ornith-1.0-35B-NVFP4
            - --served-model-name
            - ornith
            - --trust-remote-code
            - --gpu-memory-utilization
            - "0.85"
            - --max-model-len
            - "262144"
            - --port
            - "8000"
            - --enable-auto-tool-choice
            - --tool-call-parser
            - qwen3_xml
            - --reasoning-parser
            - qwen3
            # usage reporting: surfaces prompt_tokens_details.cached_tokens so
            # clients (ctxmap bench cache-hit%) can measure prefix-cache hits.
            # Reads 0 while APC is OFF; becomes meaningful when APC returns.
            - --enable-prompt-tokens-details
            # APC: re-enabled 2026-07-26 after the 8h soak — see note above.
            # Without this flag vLLM AUTO-DISABLES prefix caching for hybrid
            # models (measured: 0% hit rate), so the flag is what selects the
            # "align" mode that actually caches. Its absence is not neutral.
            - --enable-prefix-caching
          env:
            - name: HF_HUB_OFFLINE
              value: "1"
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - { mountPath: /cache, name: cache }
            - { mountPath: /dev/shm, name: shm }
      volumes:
        - name: cache
          persistentVolumeClaim: { claimName: hf-cache }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 16Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-ornith
  namespace: model-stack
  labels: { app: vllm-ornith }
spec:
  type: NodePort
  selector: { app: vllm-ornith }
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30801
      protocol: TCP
