# model-stack: LiteLLM gateway — the single OpenAI-compatible front door
# (onyx-kestrel Phase 1). Routes model-name -> backend; nothing talks to a model
# backend directly. CPU-only, pinned to dMon (so the in-cluster fleet reaches it
# via ClusterIP); it reaches the GB10 ollama over the tailnet. Frontier-escalation
# (claude) entry is added later with a credential. Bespoke (config + nodeSelector)
# so it's a raw manifest.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: model-stack
data:
  # config.yaml below was SYNCED FROM LIVE 2026-07-24 (NEX-819): the repo copy
  # had drifted to 4 stale routes while live carries 16 — applying the old block
  # would have deleted every kimi/glm/deepseek/vision/embedding route agora
  # depends on. Secrets remain os.environ/* references; no literal keys here.
  config.yaml: |
    model_list:
      - model_name: code
        litellm_params: {model: openai/ornith, api_base: "http://100.92.111.3:30801/v1", api_key: dummy}
      - model_name: general
        litellm_params: {model: openai/ornith, api_base: "http://100.92.111.3:30801/v1", api_key: dummy}
      - model_name: control
        litellm_params: {model: openai/ornith, api_base: "http://100.92.111.3:30801/v1", api_key: dummy}
      - model_name: glm-4.6
        litellm_params: {model: openai/glm-4.6, api_base: "https://api.z.ai/api/coding/paas/v4", api_key: os.environ/ZAI_API_KEY}
      - model_name: deepseek-v4-flash
        litellm_params: {model: deepseek/deepseek-v4-flash, api_key: os.environ/DEEPSEEK_API_KEY, extra_body: {thinking: {type: enabled}, reasoning_effort: high}}
      - model_name: deepseek-v4-flash-fast
        litellm_params: {model: deepseek/deepseek-v4-flash, api_key: os.environ/DEEPSEEK_API_KEY, extra_body: {thinking: {type: disabled}}}
      - model_name: deepseek-v4-pro
        litellm_params: {model: deepseek/deepseek-v4-pro, api_key: os.environ/DEEPSEEK_API_KEY, extra_body: {thinking: {type: enabled}, reasoning_effort: high}}
      - model_name: deepseek-reasoner
        litellm_params: {model: deepseek/deepseek-v4-flash, api_key: os.environ/DEEPSEEK_API_KEY, extra_body: {thinking: {type: enabled}, reasoning_effort: high}}
      - model_name: deepseek-chat
        litellm_params: {model: deepseek/deepseek-v4-flash, api_key: os.environ/DEEPSEEK_API_KEY, extra_body: {thinking: {type: disabled}}}
      - model_name: kimi-k3
        litellm_params: {model: openrouter/moonshotai/kimi-k3, api_key: os.environ/OPENROUTER_API_KEY}
      - model_name: ornith
        litellm_params: {model: openai/ornith, api_base: "http://100.92.111.3:30801/v1", api_key: dummy}
      - model_name: ornith-judge
        litellm_params: {model: openai/ornith, api_base: "http://100.92.111.3:30801/v1", api_key: dummy, extra_body: {chat_template_kwargs: {enable_thinking: false}}}
      - model_name: vision
        litellm_params: {model: openai/gemma-4-12b, api_base: "http://100.91.185.71:30804/v1", api_key: dummy}
      - model_name: gemma-4-12b
        litellm_params: {model: openai/gemma-4-12b, api_base: "http://100.91.185.71:30804/v1", api_key: dummy}
      - model_name: embeddings
        litellm_params: {model: openai/embeddinggemma, api_base: "http://100.92.111.3:30802/v1", api_key: dummy}
      - model_name: qwen3.6
        litellm_params: {model: openai/qwen3.6, api_base: "http://100.92.111.3:30800/v1", api_key: dummy}
    litellm_settings: {drop_params: true}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: model-stack
  labels: {app: litellm}
spec:
  replicas: 1
  strategy: {type: Recreate}   # single hostNetwork pod on :4000 — avoid rollout port-conflict deadlock
  selector:
    matchLabels: {app: litellm}
  template:
    metadata:
      labels: {app: litellm}
    spec:
      # hostNetwork so the gateway egresses from dMon's host (which can reach the
      # GB10 ollama over the tailnet) — pod-CIDR egress to a tailnet peer doesn't
      # route. Binds dMon:4000; the fleet reaches it via the ClusterIP (→ host) or
      # dMon's tailnet IP directly.
      hostNetwork: true
      dnsPolicy: Default
      # Pinned to robo-dog (the arm64 GB10 inference node) so the gateway sits
      # next to the models it fronts. Matches live (verified 2026-07-24, NEX-819);
      # the previous dmonextreme value was stale repo state that never applied.
      nodeSelector: {kubernetes.io/hostname: robo-dog}
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports:
            - {name: http, containerPort: 4000}
          volumeMounts:
            - {name: config, mountPath: /etc/litellm}
      volumes:
        - name: config
          configMap: {name: litellm-config}
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: model-stack
spec:
  selector: {app: litellm}
  ports:
    - {name: http, port: 4000, targetPort: 4000}
