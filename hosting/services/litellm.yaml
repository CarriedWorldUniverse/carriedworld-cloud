# model-stack: LiteLLM gateway — the single OpenAI-compatible front door
# (onyx-kestrel Phase 1). Routes model-name -> backend; nothing talks to a model
# backend directly. CPU-only, pinned to dMon (so the in-cluster fleet reaches it
# via ClusterIP); it reaches the GB10 ollama over the tailnet. Frontier-escalation
# (claude) entry is added later with a credential. Bespoke (config + nodeSelector)
# so it's a raw manifest.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: model-stack
data:
  # config.yaml below was SYNCED FROM LIVE 2026-07-24 (NEX-819): the repo copy
  # had drifted to 4 stale routes while live carries 16 — applying the old block
  # would have deleted every kimi/glm/deepseek/vision/embedding route agora
  # depends on. Secrets remain os.environ/* references; no literal keys here.
  #
  # 2026-08-16: the served model id is now "inkling-small", NOT
  # "deepseek-v4-flash". robo-dog's ds4-server was switched to
  # Inkling-Small-UD-IQ2_XXS.accretion.gguf (DS4_ARCH=inkling) and nothing
  # updated this config, so all seven local aliases had been sending an unknown
  # model name to a live server. It does NOT 404 — it HANGS (verified: no
  # response in 20s; the same request with "inkling-small" returns 200), which
  # is why the breakage was silent. Alias names are unchanged, as below.
  #
  # The id is derived from the model path, so it CHANGES whenever the loaded
  # model changes. This line is the coupling: swapping the gguf on robo-dog
  # without editing here breaks every local alias again, the same silent way.
  # hosts/robo-dog/ds4-server.env carries the matching capture.
  #
  # 2026-08-02 (operator decree): ds4-server on robo-dog (100.92.111.3:8000,
  # OpenAI-compatible, model id "deepseek-v4-flash") was promoted to GA. Every
  # LOCAL alias (code/general/control/ornith/ornith-judge/qwen3.6, plus the new
  # ds4-flash alias) now resolves to that backend — alias NAMES are unchanged
  # (consumers like ticket-pipeline reference ornith-judge by name; the point
  # is they all resolve to whatever is currently active in ds4) but the
  # previous per-alias distinctions (separate vllm-ornith / qwen3.6 NodePorts)
  # are gone by operator decision, superseding the earlier "leave them honest
  # about their down targets" call. Cloud aliases (glm-4.6, deepseek-*,
  # kimi-k3) and the separate-modality local services (vision, gemma-4-12b,
  # embeddings — not chat-completion swap-ins for a chat model) are untouched.
  #
  # Abstention system prompt ("If you are not confident, say you don't know.")
  # was evaluated against this image's litellm version (main-stable, prompt
  # registry present) for a declarative per-model system-prompt mechanism.
  # None exists that fits here: the only prompt-injection path is the
  # dotprompt/langfuse/generic "Prompt Management" system, which requires
  # routing through a `dotprompt/<model>` alias prefix and a client-supplied
  # `prompt_id` per call (it replaces/templates the message list rather than
  # prepending a system message to whatever the caller sends), so it would
  # change the alias's request contract for every caller instead of being a
  # transparent per-alias default. No litellm_params.system_prompt /
  # litellm_settings.default_system_message field exists in this version.
  # Verdict: not clean — SKIPPED. The abstention instruction must be applied
  # client-side (e.g. in ticket-pipeline's/agent's own system prompt) until
  # litellm ships a plain per-model default-system-message config field.
  config.yaml: |
    model_list:
      - model_name: code
        litellm_params: {model: openai/inkling-small, api_base: "http://100.92.111.3:8000/v1", api_key: dummy}
      - model_name: general
        litellm_params: {model: openai/inkling-small, api_base: "http://100.92.111.3:8000/v1", api_key: dummy}
      - model_name: control
        litellm_params: {model: openai/inkling-small, api_base: "http://100.92.111.3:8000/v1", api_key: dummy}
      - model_name: ds4-flash
        litellm_params: {model: openai/inkling-small, api_base: "http://100.92.111.3:8000/v1", api_key: dummy}
      - model_name: glm-4.6
        litellm_params: {model: openai/glm-4.6, api_base: "https://api.z.ai/api/coding/paas/v4", api_key: os.environ/ZAI_API_KEY}
      - model_name: deepseek-v4-flash
        litellm_params: {model: deepseek/deepseek-v4-flash, api_key: os.environ/DEEPSEEK_API_KEY, extra_body: {thinking: {type: enabled}, reasoning_effort: high}}
      - model_name: deepseek-v4-flash-fast
        litellm_params: {model: deepseek/deepseek-v4-flash, api_key: os.environ/DEEPSEEK_API_KEY, extra_body: {thinking: {type: disabled}}}
      - model_name: deepseek-v4-pro
        litellm_params: {model: deepseek/deepseek-v4-pro, api_key: os.environ/DEEPSEEK_API_KEY, extra_body: {thinking: {type: enabled}, reasoning_effort: high}}
      - model_name: deepseek-reasoner
        litellm_params: {model: deepseek/deepseek-v4-flash, api_key: os.environ/DEEPSEEK_API_KEY, extra_body: {thinking: {type: enabled}, reasoning_effort: high}}
      - model_name: deepseek-chat
        litellm_params: {model: deepseek/deepseek-v4-flash, api_key: os.environ/DEEPSEEK_API_KEY, extra_body: {thinking: {type: disabled}}}
      - model_name: kimi-k3
        litellm_params: {model: openrouter/moonshotai/kimi-k3, api_key: os.environ/OPENROUTER_API_KEY}
      - model_name: ornith
        litellm_params: {model: openai/inkling-small, api_base: "http://100.92.111.3:8000/v1", api_key: dummy}
      - model_name: ornith-judge
        litellm_params: {model: openai/inkling-small, api_base: "http://100.92.111.3:8000/v1", api_key: dummy}
      # `vision` DROPPED 2026-08-16 (operator): there is no local multimodal
      # backend any more. It pointed at 100.91.185.71:30804 (vllm-gemma4-vision-dmon),
      # which is at 0 replicas and unreachable — verified HTTP 000. A route that
      # cannot succeed is worse than an absent one: callers hang instead of
      # failing fast with "model not found". vision-review is offline until a
      # multimodal backend exists again; re-add a route when one does.
      #
      # `embeddings` DROPPED 2026-08-16 (operator): VESTIGIAL, not just dead.
      # It pointed at vllm-embeddinggemma (100.92.111.3:30802, 0 replicas,
      # HTTP 000), but commonplace — the only thing that ever used embeddings —
      # does NOT go through this gateway at all. It talks to ollama directly:
      # COMMONPLACE_EMBED_PROVIDER=ollama, nomic-embed-text, dim 768. In cwb-core
      # that is the ollama `embed` sidecar over loopback (127.0.0.1:11434, which
      # is why that container declares no ports). No consumer of this alias
      # remains, so it is removed rather than repointed.
      #
      # STILL DEAD, left in place pending an operator call: gemma-4-12b, on the
      # same 30804 backend vision used (0 replicas, HTTP 000). Only vision and
      # embeddings were authorised for removal.
      - model_name: gemma-4-12b
        litellm_params: {model: openai/gemma-4-12b, api_base: "http://100.91.185.71:30804/v1", api_key: dummy}
      - model_name: qwen3.6
        litellm_params: {model: openai/inkling-small, api_base: "http://100.92.111.3:8000/v1", api_key: dummy}
    litellm_settings: {drop_params: true}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: model-stack
  labels: {app: litellm}
spec:
  replicas: 1
  strategy: {type: Recreate}   # single hostNetwork pod on :4000 — avoid rollout port-conflict deadlock
  selector:
    matchLabels: {app: litellm}
  template:
    metadata:
      labels: {app: litellm}
    spec:
      # hostNetwork so the gateway egresses from dMon's host (which can reach the
      # GB10 ollama over the tailnet) — pod-CIDR egress to a tailnet peer doesn't
      # route. Binds dMon:4000; the fleet reaches it via the ClusterIP (→ host) or
      # dMon's tailnet IP directly.
      hostNetwork: true
      dnsPolicy: Default
      # Pinned to robo-dog (the arm64 GB10 inference node) so the gateway sits
      # next to the models it fronts. Matches live (verified 2026-07-24, NEX-819);
      # the previous dmonextreme value was stale repo state that never applied.
      nodeSelector: {kubernetes.io/hostname: robo-dog}
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports:
            - {name: http, containerPort: 4000}
          volumeMounts:
            - {name: config, mountPath: /etc/litellm}
      volumes:
        - name: config
          configMap: {name: litellm-config}
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: model-stack
spec:
  selector: {app: litellm}
  ports:
    - {name: http, port: 4000, targetPort: 4000}
