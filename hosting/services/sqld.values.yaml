name: sqld
namespace: cwb
kind: Deployment
strategy: Recreate
image: ghcr.io/tursodatabase/libsql-server:latest
env:
  SQLD_NODE: primary
  SQLD_HTTP_LISTEN_ADDR: "0.0.0.0:8080"
port: 8080
storage:
  size: 20Gi
  mountPath: /var/lib/sqld
  storageClassName: local-path
identity:
  mode: none
tailnetEdge: false

# replicas:0 — the standalone sqld is RETIRED: the database now runs as the
# `sqld` container inside nexus-control (see its app.nexus/sqld label), the same
# consolidation cwb-core did for the pillars. Live has been 0 for 48d; without
# this key the chart default (1) applies and reconcile would stand a second,
# empty sqld up beside the real one. Matches live — NEX-819.
replicas: 0
