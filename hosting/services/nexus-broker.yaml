# RETIRED 2026-07-24 (NEX-819): the nexus-broker Deployment that lived here was
# the pre-convergence broker TWIN. The live broker is the `nexus-control`
# Deployment (one broker, operator decision — the twin was retired in the li1
# convergence). It is deliberately NOT declared here: re-adding it would stand a
# second broker up beside nexus-control, both claiming the same tailnet hostname
# and the same state. The Service + PVC below are still live and still used BY
# nexus-control, which is why this file still exists.
---
# In-cluster reach for pod-aspects (the dispatch-native endgame): cluster DNS
# nexus-broker.nexus.svc:7888. External/remote aspects + the operator UI reach
# the broker over the tailnet at nexus.tail41686e.ts.net:7888 (the sidecar).
apiVersion: v1
kind: Service
metadata:
  name: nexus-broker
  namespace: nexus
spec:
  type: ClusterIP
  # Pinned so in-cluster aspects can hostAlias nexus.tail41686e.ts.net → this
  # IP (the name must resolve to the broker AND match its TLS cert).
  clusterIP: 10.43.138.250
  # Selects nexus-control: the broker Deployment was renamed at the li1
  # convergence; this Service name/ClusterIP stayed for the hostAlias + TLS
  # cert. Matches live (verified 2026-07-24) — do not revert to app: nexus-broker.
  selector:
    app: nexus-control
  ports:
    - { name: broker, port: 7888, targetPort: 7888 }
---
# Aspect-dir + on-disk broker state (the DB itself lives in sqld). Seeded at
# cutover from the host /var/lib/nexus/aspects (~134M).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus-broker-data
  namespace: nexus
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
