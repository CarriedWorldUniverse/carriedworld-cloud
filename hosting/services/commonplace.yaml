# commonplace — the CWB knowledge-store pillar. Extracted from live cluster
# 2026-06-12 (was cluster-state-only).
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: commonplace-tls
  namespace: cwb
spec:
  dnsNames:
  # public SAN — live carries it; dropping it breaks TLS for anything
  # reaching this pillar by its core.carriedworld.dev name (NEX-819).
  - commonplace.core.carriedworld.dev
  - commonplace.cwb.svc
  - commonplace.cwb.svc.cluster.local
  - commonplace
  issuerRef:
    kind: Issuer
    name: cwb-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  secretName: commonplace-tls
  usages:
  - server auth

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: commonplace-data
  namespace: cwb
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commonplace
  namespace: cwb
spec:
  # RETIRED 2026-08-16 (operator: commonplace belongs in the cwb-core pillar pod,
  # not standalone): this copy was still running AND still selected by the
  # Service, while the cwb-core `commonplace` container ran alongside it.
  #
  # They mount the SAME PVC (commonplace-data, ReadWriteOnce, local-path) at the
  # same path, and both pods sit on dMon — which is exactly why RWO did not stop
  # it. So TWO commonplace processes were open on ONE SQLite file
  # (/var/lib/cwb/commonplace.db) concurrently: a corruption and lock-contention
  # hazard, not merely a duplicate.
  #
  # This copy was also the BROKEN one. Its COMMONPLACE_EMBED_URL below points at
  # 192.168.143.133:11434, a LAN address that no longer answers (ARP FAILED —
  # another host that moved, same class as the robo-dog .124 -> .248 move that
  # broke flannel). The cwb-core container uses 127.0.0.1:11434, the ollama
  # `embed` sidecar in its own pod, which works. Embeddings were therefore dead
  # on the copy that was actually serving traffic, and silently: nothing logs it.
  #
  # replicas MUST stay 0. Do not raise without deciding which copy owns the DB —
  # both writing at once is the hazard this closes. The dead EMBED_URL below is
  # left as-is deliberately: fix it before ever resurrecting this.
  replicas: 0
  selector:
    matchLabels:
      app: commonplace
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: commonplace
    spec:
      # amd64 pin: robo-dog is arm64 and these images are amd64-only, so without
      # this the pod can schedule onto robo-dog and fail. Matches live
      # (verified 2026-07-24, NEX-819).
      nodeSelector:
        kubernetes.io/arch: amd64

      containers:
      - env:
        - name: COMMONPLACE_GRPC_ADDR
          value: :8101
        - name: COMMONPLACE_TLS_CERT
          value: /etc/cwb/tls/tls.crt
        - name: COMMONPLACE_TLS_KEY
          value: /etc/cwb/tls/tls.key
        - name: COMMONPLACE_TLS_CA
          value: /etc/cwb/tls/ca.crt
        - name: COMMONPLACE_ADDR
          value: :8101
        - name: COMMONPLACE_DB
          value: /var/lib/cwb/commonplace.db
        - name: COMMONPLACE_EMBED_PROVIDER
          value: ollama
        - name: COMMONPLACE_EMBED_URL
          value: http://192.168.143.133:11434
        - name: COMMONPLACE_EMBED_MODEL
          value: nomic-embed-text
        - name: COMMONPLACE_EMBED_DIM
          value: '768'
        image: ghcr.io/carriedworlduniverse/commonplace:sha-d99e37b@sha256:ff64559a4c8be69ccd63b73a4bf907889355639ffb9e0e6043e4be7fc58a2d3a
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 15
          successThreshold: 1
          tcpSocket:
            port: 8101
          timeoutSeconds: 1
        name: commonplace
        ports:
        - containerPort: 8101
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 2
          periodSeconds: 5
          successThreshold: 1
          tcpSocket:
            port: 8101
          timeoutSeconds: 1
        resources: {}
        volumeMounts:
        - mountPath: /etc/cwb/tls
          name: tls
          readOnly: true
        - mountPath: /var/lib/cwb
          name: data
      volumes:
      - name: tls
        secret:
          defaultMode: 420
          secretName: commonplace-tls
      - name: data
        persistentVolumeClaim:
          claimName: commonplace-data

---
apiVersion: v1
kind: Service
metadata:
  name: commonplace
  namespace: cwb
spec:
  # REPOINTED 2026-08-16 to the cwb-core pillar pod, alongside retiring the
  # standalone Deployment above. Same pattern as porter-backup and
  # interchange-gateway: the pillar moved into cwb-core and its Service was left
  # selecting the old standalone label.
  #
  # This one differed from those two in that it was NOT endpoint-less — the
  # standalone pod was still up, so the Service resolved fine and looked healthy
  # while quietly serving the copy whose embed backend was dead.
  #
  # targetPort MUST be cmnpl-http: cwb-core names this port `cmnpl-http`, not
  # `http` (port names are pod-local; the pillar pod disambiguates ten
  # containers). Both listen on 8101.
  #
  # No data migration: both copies already mount the same commonplace-data PVC
  # and the same /var/lib/cwb/commonplace.db, so this changes which process
  # serves, not which data is served.
  ports:
  - name: http
    port: 8101
    protocol: TCP
    targetPort: cmnpl-http
  selector:
    app.cwb/commonplace: "true"
  type: ClusterIP

