# NEX-816: the diff-first, alert-before-apply periodic reconcile, as a k3s
# CronJob. This is an ALTERNATIVE to hosting/reconcile/reconcile.service +
# reconcile.timer (systemd, run on the host) -- pick one, don't run both.
# It supersedes the older, apply-only ../../bootstrap/hosting-reconcile-cronjob.yaml
# (which pulls and applies with no diff and no alert); if this CronJob is
# adopted, retire that one.
#
# ACTIVATION:
#   kubectl create secret generic hosting-git-token -n nexus \
#     --from-literal=token=<read-only PAT for this repo>
#   kubectl create secret generic reconcile-discord-webhook -n nexus \
#     --from-literal=webhook=<Discord webhook URL>   # never commit this URL
apiVersion: v1
kind: ServiceAccount
metadata: { name: hosting-reconciler, namespace: nexus }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: hosting-reconciler }
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get","list","watch","create","update","patch"]
  - apiGroups: [""]
    resources: ["services","persistentvolumeclaims","configmaps","serviceaccounts","namespaces"]
    verbs: ["get","list","watch","create","update","patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles","rolebindings","clusterroles","clusterrolebindings"]
    verbs: ["get","list","watch","create","update","patch","bind","escalate"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates","issuers"]
    verbs: ["get","list","create","update","patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: hosting-reconciler }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: hosting-reconciler }
subjects:
  - { kind: ServiceAccount, name: hosting-reconciler, namespace: nexus }
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: hosting-reconcile, namespace: nexus }
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: hosting-reconciler
          restartPolicy: Never
          containers:
            - name: reconcile
              image: dtzar/helm-kubectl:latest
              env:
                - name: GIT_TOKEN
                  valueFrom: { secretKeyRef: { name: hosting-git-token, key: token } }
                - name: RECONCILE_WEBHOOK_FILE
                  value: /etc/carriedworld/discord_webhook
              volumeMounts:
                - { name: discord-webhook, mountPath: /etc/carriedworld, readOnly: true }
              command: ["/bin/sh","-c"]
              args:
                - |
                  set -e
                  apk add --no-cache git bash >/dev/null
                  git clone --depth 1 "https://x-access-token:${GIT_TOKEN}@github.com/CarriedWorldUniverse/carriedworld-cloud" /repo
                  cd /repo && RECONCILE_NO_PULL=1 bash hosting/reconcile/reconcile.sh
          volumes:
            - name: discord-webhook
              secret:
                secretName: reconcile-discord-webhook
                items:
                  - { key: webhook, path: discord_webhook }
